<svg width="800" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes twinkle {
        0% { opacity: 0.2; }
        50% { opacity: 1; }
        100% { opacity: 0.2; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      .star { fill: white; animation: twinkle 3s infinite ease-in-out; }
      .text-title {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 800;
        font-size: 60px;
        fill: #E0FFFF;
        filter: url(#glow);
        animation: float 6s infinite ease-in-out;
      }
      .text-subtitle {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 400;
        font-size: 24px;
        fill: #B0C4DE;
        letter-spacing: 2px;
      }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="spaceGrad" cx="0.5" cy="0.5" r="0.8" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#spaceGrad)" rx="15" />

  <!-- Stars (Randomly placed) -->
  <circle cx="50" cy="50" r="1.5" class="star" style="animation-delay: 0s" />
  <circle cx="120" cy="180" r="1" class="star" style="animation-delay: 1s" />
  <circle cx="700" cy="40" r="2" class="star" style="animation-delay: 2s" />
  <circle cx="650" cy="200" r="1.5" class="star" style="animation-delay: 0.5s" />
  <circle cx="300" cy="30" r="1" class="star" style="animation-delay: 1.5s" />
  <circle cx="400" cy="220" r="1" class="star" style="animation-delay: 2.5s" />
  <circle cx="550" cy="80" r="1.5" class="star" style="animation-delay: 0.2s" />
  <circle cx="200" cy="150" r="1" class="star" style="animation-delay: 1.2s" />
  <circle cx="50" cy="220" r="1.5" class="star" style="animation-delay: 0.8s" />
  <circle cx="750" cy="120" r="2" class="star" style="animation-delay: 1.8s" />
  <!-- More stars for density -->
  <circle cx="350" cy="100" r="1" class="star" style="opacity: 0.5" />
  <circle cx="450" cy="150" r="1" class="star" style="opacity: 0.3" />
  <circle cx="150" cy="80" r="1" class="star" style="opacity: 0.6" />

  <!-- Text Content -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" dy="-20" class="text-title">
    Rofikul Huda
  </text>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" dy="40" class="text-subtitle">
    WEB DEVELOPER | AI ENTHUSIAST
  </text>

  <!-- Decorative Accent Lines -->
  <line x1="250" y1="160" x2="550" y2="160" stroke="#00bfff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>

<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 48px; fill: #ffffff; letter-spacing: -1px; }
      .text-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #8b949e; letter-spacing: 0.5px; }
      .glass { fill: #0d1117; fill-opacity: 0.6; stroke: #30363d; stroke-width: 1; }
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#00bfff" stop-opacity="0.1" />
      <stop offset="0.7" stop-color="#ff00aa" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background with subtle gradient glow -->
  <rect width="800" height="200" rx="24" fill="#0d1117" />
  <rect width="800" height="200" rx="24" fill="url(#glow)" />

  <!-- Glass border effect -->
  <rect x="0.5" y="0.5" width="799" height="199" rx="23.5" stroke="#30363d" stroke-opacity="0.5" />

  <!-- Content -->
  <text x="50%" y="45%" text-anchor="middle" dominant-baseline="middle" class="text-name">Rofikul Huda</text>
  <text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle" class="text-role">Web Developer & AI Enthusiast</text>
</svg>

    <text x="130" y="0" class="tab-btn" fill="#58a6ff">[02: STACK]</text>
    <text x="250" y="0" class="tab-btn" fill="#484f58">[03: PING]</text>
    <text x="360" y="0" class="tab-btn" fill="#484f58">[04: AUTOMATA]</text>
    <line x1="0" y1="12" x2="752" y2="12" stroke="#21262d" stroke-width="1" />
  </g>

  <g transform="translate(24, 90)">

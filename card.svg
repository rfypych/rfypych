    .prompt { fill: #58a6ff; font-weight: 600; }
    .cmd { fill: #e6edf3; font-weight: 500; }
    
    .k { fill: #7ee787; }
    .s { fill: #a5d6ff; }
    .b { fill: #79c0ff; }
    .p { fill: #7d8590; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;

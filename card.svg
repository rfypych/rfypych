<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dot { fill: #383e47; }
    .title { fill: #7d8590; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; }

    .code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
    .prompt { fill: #58a6ff; font-weight: 600; }
    .cmd { fill: #e6edf3; font-weight: 500; }
    .name { fill: #ffffff; font-weight: 600; font-size: 14px; }
    .text { fill: #c9d1d9; }
    .dim { fill: #7d8590; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #58a6ff;
    }
  </style>

  <rect x="1" y="1" width="798" height="258" rx="6" class="bg" />
  <path d="M 1 7 Q 1 1 7 1 L 793 1 Q 799 1 799 7 L 799 30 L 1 30 Z" class="header" />
  
  <circle cx="16" cy="15" r="4" class="dot" />
  <circle cx="28" cy="15" r="4" class="dot" />
  <circle cx="40" cy="15" r="4" class="dot" />

  <text x="400" y="19" text-anchor="middle" class="title">rfypych@workspace:~</text>

  <g transform="translate(24, 58)">
    <text x="0" y="0" class="code">
      <tspan class="prompt">❯</tspan> <tspan class="cmd">whoami</tspan>
    </text>
    <text x="0" y="24" class="code">
      <tspan class="name">Rofikul Huda</tspan>
    </text>

    <text x="0" y="60" class="code">
      <tspan class="prompt">❯</tspan> <tspan class="cmd">cat about.txt</tspan>
    </text>
    <text x="0" y="84" class="code">
      <tspan class="text">Developer based in Indonesia. Focused on building web applications and exploring security &amp; systems.</tspan>
    </text>

    <text x="0" y="120" class="code">
      <tspan class="prompt">❯</tspan> <tspan class="cmd">cat focus.txt</tspan>
    </text>
    <text x="0" y="144" class="code">
      <tspan class="text">Full-stack development, application security, open-source tooling</tspan>
    </text>

    <text x="0" y="180" class="code">
      <tspan class="prompt">❯</tspan> <rect x="14" y="169" width="7" height="13" class="cursor" />
    </text>
  </g>
</svg>

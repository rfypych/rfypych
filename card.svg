<svg width="800" height="290" viewBox="0 0 800 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .header { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dot { fill: #383e47; }
    .title { fill: #7d8590; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; }

    .code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
    .user { fill: #58a6ff; font-weight: 500; }
    .path { fill: #7d8590; }
    .symbol { fill: #7d8590; }
    .cmd { fill: #e6edf3; font-weight: 500; }
    .out { fill: #c9d1d9; }
    .json-key { fill: #7ee787; }
    .json-str { fill: #a5d6ff; }
    .json-bracket { fill: #79c0ff; }
    .json-punc { fill: #7d8590; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #58a6ff;
    }
  </style>

  <rect x="1" y="1" width="798" height="288" rx="6" class="bg" />
  <path d="M 1 7 Q 1 1 7 1 L 793 1 Q 799 1 799 7 L 799 30 L 1 30 Z" class="header" />
  
  <circle cx="16" cy="15" r="4" class="dot" />
  <circle cx="28" cy="15" r="4" class="dot" />
  <circle cx="40" cy="15" r="4" class="dot" />

  <text x="400" y="19" text-anchor="middle" class="title">rfypych@workspace:~</text>

  <g transform="translate(20, 56)">
    <text x="0" y="0" class="code">
      <tspan class="user">rfypych@workspace</tspan><tspan class="symbol">:</tspan><tspan class="path">~</tspan><tspan class="symbol">$</tspan> <tspan class="cmd">whoami</tspan>
    </text>
    <text x="0" y="22" class="code">
      <tspan class="out">Rofikul Huda</tspan>
    </text>

    <text x="0" y="54" class="code">
      <tspan class="user">rfypych@workspace</tspan><tspan class="symbol">:</tspan><tspan class="path">~</tspan><tspan class="symbol">$</tspan> <tspan class="cmd">cat profile.json</tspan>
    </text>
    
    <text x="0" y="76" class="code"><tspan class="json-bracket">{</tspan></text>
    <text x="16" y="96" class="code">
      <tspan class="json-key">"role"</tspan><tspan class="json-punc">: </tspan><tspan class="json-str">"Full-Stack Development &amp; Systems Security"</tspan><tspan class="json-punc">,</tspan>
    </text>
    <text x="16" y="116" class="code">
      <tspan class="json-key">"location"</tspan><tspan class="json-punc">: </tspan><tspan class="json-str">"Indonesia (UTC+07:00)"</tspan><tspan class="json-punc">,</tspan>
    </text>
    <text x="16" y="136" class="code">
      <tspan class="json-key">"stack"</tspan><tspan class="json-punc">: </tspan><tspan class="json-bracket">[</tspan><tspan class="json-str">"TypeScript"</tspan><tspan class="json-punc">, </tspan><tspan class="json-str">"Node.js"</tspan><tspan class="json-punc">, </tspan><tspan class="json-str">"Python"</tspan><tspan class="json-punc">, </tspan><tspan class="json-str">"Go"</tspan><tspan class="json-punc">, </tspan><tspan class="json-str">"Linux"</tspan><tspan class="json-bracket">]</tspan><tspan class="json-punc">,</tspan>
    </text>
    <text x="16" y="156" class="code">
      <tspan class="json-key">"focus"</tspan><tspan class="json-punc">: </tspan><tspan class="json-str">"Minimalist architectures, web systems &amp; security analysis"</tspan>
    </text>
    <text x="0" y="176" class="code"><tspan class="json-bracket">}</tspan></text>

    <text x="0" y="208" class="code">
      <tspan class="user">rfypych@workspace</tspan><tspan class="symbol">:</tspan><tspan class="path">~</tspan><tspan class="symbol">$</tspan> <rect x="156" y="197" width="7" height="13" class="cursor" />
    </text>
  </g>
</svg>

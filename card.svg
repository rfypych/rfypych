    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; font-weight: 600; }
    .key { fill: #7d8590; }
    .val { fill: #58a6ff; font-weight: 500; }
    .str { fill: #a5d6ff; }
    .dim { fill: #484f58; }
    .active-dot { fill: #3fb950; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

name: Interactive Terminal

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  execute-terminal:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'run:') || startsWith(github.event.issue.title, 'run ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Terminal Engine
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python engine.py --issue-title "${{ github.event.issue.title }}" --issue-user "${{ github.event.issue.user.login }}"
          else
            python engine.py --issue-title "run: evolve-life" --issue-user "cron-daemon"
          fi

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(terminal): update from issue #${{ github.event.issue.number || 'cron' }}"
          git push

      - name: Close Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "[ok] Command \`${{ github.event.issue.title }}\` executed successfully on profile README."
          gh issue close ${{ github.event.issue.number }} --reason "completed"

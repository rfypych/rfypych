name: Interactive Terminal

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  execute-command:
    if: startsWith(github.event.issue.title, 'run:') || startsWith(github.event.issue.title, 'run ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Command & Render SVG
        run: |
          python engine.py --issue-title "${{ github.event.issue.title }}" --issue-user "${{ github.event.issue.user.login }}"

      - name: Commit and push SVG update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: execute '${{ github.event.issue.title }}' by @${{ github.event.issue.user.login }}"
          git push

      - name: Close Trigger Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "[ok] Command \`${{ github.event.issue.title }}\` executed. Terminal SVG updated on profile README."
          gh issue close ${{ github.event.issue.number }} --reason "completed"
